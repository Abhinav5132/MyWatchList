[package]
name = "MyWatchList"
version = "0.1.0"
authors = ["techy"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
dioxus = { version = "0.6.0", features = ["router"] }
dirs = "6.0.0"
once_cell = "1.21.3"
tracing = "0.1.41"
actix-web = { version = "4.11.0", features = ["openssl"] }
sqlx = {version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "macros", "sqlx-sqlite"] }
tokio = {version = "1.45.1", features = ["full"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
actix-cors = "0.7.1"
reqwest = { version = "0.12.20", features = ["json"] }
dotenvy = "0.15.7"
argon2 = { version = "0.5.3", features = ["std"] }
rand_core = "0.6.4"
password-hash = "0.5.0"
openssl = "0.10.73"
chrono = "0.4.41"
jsonwebtoken = "9.3.1"
image = "0.25.8"
actix-rt = "2.11.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"]}
rfd = "0.15.4"
anyhow = "1.0.100"
regex = "1.12.2"
html-escape = "0.2.13"
env_logger = "0.11.8"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
