[package]
name = "MyWatchList"
version = "0.1.0"
authors = ["techy"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
actix-web = { version = "4.11.0"}
sqlx = {version = "0.8.6", features = ["runtime-tokio-rustls", "macros","postgres"] }
tokio = {version = "1.45.1", features = ["full"]}
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version = "0.12.20", features = ["json"] }
dotenvy = "0.15.7"
argon2 = { version = "0.5.3", features = ["std"] }
rand_core = "0.6.4"
chrono = "0.4.41"
jsonwebtoken = "9.3.1"
image = "0.25.8"
anyhow = "1.0.100"
html-escape = "0.2.13"
env_logger = "0.11.8"
actix-cors = "0.7.1"
regex = "1.12.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
