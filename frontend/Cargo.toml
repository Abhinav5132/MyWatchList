[package]
name = "frontend"
version = "0.1.0"
authors = ["techy"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.22.1"
dioxus = { version = "0.6.0", features = ["router"] }
dirs = "6.0.0"
image = "0.25.8"
once_cell = "1.21.3"
reqwest = { version = "0.12.20", features = ["json", ] }
serde = "1.0.219"
serde_json = "1.0.140"
tokio = "1.47.1"
tracing = "0.1.41"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
